name: Compilar Payload PS5 Nativo

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar tu codigo fuente
      uses: actions/checkout@v4

    - name: Instalar compilador de PS5 (Clang/LLVM)
      run: |
        sudo apt-get update
        sudo apt-get install -y clang lld make

    - name: Descargar dependencias del SDK de John Tornblom
      run: |
        git clone --depth=1 https://github.com sdk_folder

    - name: Compilar el codigo de forma directa
      run: |
        clang -target x86_64-pc-freebsd12 -shared -fPIC -nostdlib -O2 \
          -isystem sdk_folder/include \
          main.c -o payload.elf \
          -Wl,--entry=payload_main -Wl,--allow-shlib-undefined

    - name: Guardar tu archivo ELF final
      uses: actions/upload-artifact@v4
      with:
        name: ps5-payload-elf
        path: payload.elf
